<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>জাতীয় পরিচয় পত্র - SVG PDF জেনারেটর</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;600;700&family=Tiro+Bangla:wght@400;700&display=swap" rel="stylesheet">

    <!-- jsPDF & html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root {
            --primary-green: #006a4e;
            --navy-blue: #005088;
            --cream-bg: #f7f2e9;
            --text-dark: #1a1a2e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Hind Siliguri', sans-serif;
            background: linear-gradient(135deg, #e8ecf1 0%, #d4dce8 100%);
            padding: 25px 15px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: var(--navy-blue);
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            color: #666;
        }

        .main-content {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 25px;
        }

        /* ===== ফর্ম সেকশন ===== */
        .form-section {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            height: fit-content;
        }

        .form-section h2 {
            font-size: 16px;
            color: var(--primary-green);
            margin-bottom: 15px;
            font-weight: 700;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 3px;
        }

        .form-group input,
        .form-group select {
            padding: 8px 10px;
            border: 1.5px solid #d1d9e6;
            border-radius: 5px;
            font-size: 12px;
            font-family: 'Hind Siliguri', sans-serif;
            background: #f9fbfd;
            transition: all 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary-green);
            box-shadow: 0 0 0 2px rgba(0, 106, 78, 0.1);
            background: white;
        }

        .file-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .file-group input[type="file"] {
            flex: 1;
            padding: 6px 8px;
            border: 2px dashed #b3c2d6;
            border-radius: 5px;
            background: #f8fafc;
            font-size: 10px;
            cursor: pointer;
        }

        .file-preview {
            width: 40px;
            height: 40px;
            border-radius: 4px;
            background: #f0f0f0;
            border: 1px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #999;
            overflow: hidden;
            flex-shrink: 0;
        }

        .file-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .btn-download {
            grid-column: 1 / -1;
            background: var(--primary-green);
            color: white;
            padding: 11px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Hind Siliguri', sans-serif;
            transition: all 0.3s;
            margin-top: 10px;
            box-shadow: 0 3px 10px rgba(0, 106, 78, 0.25);
        }

        .btn-download:hover {
            background: #00563e;
            transform: translateY(-1px);
        }

        /* ===== প্রিভিউ সেকশন ===== */
        .preview-section {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .preview-section h2 {
            font-size: 16px;
            color: var(--primary-green);
            margin-bottom: 15px;
            font-weight: 700;
            width: 100%;
        }

        #nid-card-svg {
            width: 100%;
            max-width: 900px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .note {
            font-size: 11px;
            color: #999;
            margin-top: 12px;
            text-align: center;
        }

        /* ===== রেসপন্সিভ ===== */
        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 0 10px;
            }

            .header h1 {
                font-size: 22px;
            }

            .main-content {
                grid-template-columns: 1fr;
            }

            .form-section {
                padding: 15px;
            }
        }
    </style>
</head>

    <script>
        let photoDataURL = null;
        let signatureDataURL = null;

        // ফটো হ্যান্ডেল
        function handlePhoto(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                photoDataURL = e.target.result;
                document.getElementById('photoPreview').innerHTML = `<img src="${photoDataURL}" alt="">`;
                updateSVG();
            };
            reader.readAsDataURL(file);
        }

        // স্বাক্ষর হ্যান্ডেল
        function handleSignature(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                signatureDataURL = e.target.result;
                document.getElementById('signaturePreview').innerHTML = `<img src="${signatureDataURL}" alt="">`;
                updateSVG();
            };
            reader.readAsDataURL(file);
        }

        // তারিখ ফরম্যাট (বাংলা)
        function formatDateBn(dateStr) {
            if (!dateStr) return '—';
            const d = new Date(dateStr + 'T00:00:00');
            if (isNaN(d.getTime())) return '—';

            const months = ['জানু', 'ফেব্রু', 'মার্চ', 'এপ্রিল', 'মে', 'জুন',
                'জুলাই', 'আগস্ট', 'সেপ্টেম্বর', 'অক্টোবর', 'নভেম্বর', 'ডিসেম্বর'];
            const day = d.getDate();
            const month = months[d.getMonth()];
            const year = d.getFullYear();

            return `${day} ${month} ${year}`;
        }

        // তারিখ ফরম্যাট (ইংরেজি)
        function formatDateEn(dateStr) {
            if (!dateStr) return '—';
            const d = new Date(dateStr + 'T00:00:00');
            if (isNaN(d.getTime())) return '—';

            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
                'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            const day = String(d.getDate()).padStart(2, '0');
            const month = months[d.getMonth()];
            const year = d.getFullYear();

            return `${day} ${month} ${year}`;
        }

        // SVG আপডেট
        function updateSVG() {
            const nameBn = document.getElementById('nameBn').value || '_________';
            const nameEn = document.getElementById('nameEn').value || '_________';
            const fatherBn = document.getElementById('fatherBn').value || '_________';
            const fatherEn = document.getElementById('fatherEn').value || '_________';
            const motherBn = document.getElementById('motherBn').value || '_________';
            const motherEn = document.getElementById('motherEn').value || '_________';
            const dob = document.getElementById('dob').value;
            const idNo = document.getElementById('idNo').value || '__________';
            const bloodGroup = document.getElementById('bloodGroup').value || '—';
            const birthplace = document.getElementById('birthplace').value || '_________';
            const address = document.getElementById('address').value || '_________';
            const issueDate = document.getElementById('issueDate').value;

            // টেক্সট আপডেট
            document.getElementById('svgNameBn').textContent = nameBn;
            document.getElementById('svgNameEn').textContent = nameEn;
            document.getElementById('svgFatherBn').textContent = fatherBn;
            document.getElementById('svgFatherEn').textContent = fatherEn;
            document.getElementById('svgMotherBn').textContent = motherBn;
            document.getElementById('svgMotherEn').textContent = motherEn;
            document.getElementById('svgDobBn').textContent = formatDateBn(dob);
            document.getElementById('svgDobEn').textContent = formatDateEn(dob);
            document.getElementById('svgBirthplace').textContent = birthplace;
            document.getElementById('svgBlood').textContent = bloodGroup;
            document.getElementById('svgAddress').textContent = address;
            document.getElementById('svgIssueBn').textContent = formatDateBn(issueDate);
            document.getElementById('svgIssueEn').textContent = formatDateEn(issueDate);
            document.getElementById('svgIdNo').textContent = idNo;

            // ফটো আপডেট
            if (photoDataURL) {
                document.getElementById('photoImage').setAttributeNS('http://www.w3.org/1999/xlink', 'href', photoDataURL);
                document.getElementById('photoImage').style.display = 'block';
                document.getElementById('photoPlaceholder').style.display = 'none';
            } else {
                document.getElementById('photoImage').style.display = 'none';
                document.getElementById('photoPlaceholder').style.display = 'block';
            }

            // স্বাক্ষর আপডেট
            if (signatureDataURL) {
                document.getElementById('signatureImage').setAttributeNS('http://www.w3.org/1999/xlink', 'href', signatureDataURL);
                document.getElementById('signatureImage').style.display = 'block';
                document.getElementById('signaturePlaceholder').style.display = 'none';
            } else {
                document.getElementById('signatureImage').style.display = 'none';
                document.getElementById('signaturePlaceholder').style.display = 'block';
            }
        }

        // PDF ডাউনলোড
        async function downloadPDF() {
            const svgElement = document.getElementById('nid-card-svg');
            const bbox = svgElement.getBBox();
            
            try {
                // SVG কে canvas এ রূপান্তর
                const canvas = await html2canvas(svgElement, {
                    scale: 3,
                    backgroundColor: '#f7f2e9',
                    logging: false,
                    useCORS: true,
                    allowTaint: true
                });

                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF({
                    orientation: 'landscape',
                    unit: 'mm',
                    format: 'a4'
                });

                const imgData = canvas.toDataURL('image/png');
                const pdfWidth = pdf.internal.pageSize.getWidth();
                const pdfHeight = pdf.internal.pageSize.getHeight();

                pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);

                const idNo = document.getElementById('idNo').value || 'NID';
                pdf.save(`NID_${idNo}.pdf`);
            } catch (error) {
                alert('PDF তৈরিতে ত্রুটি: ' + error.message);
                console.error(error);
            }
        }

        // পেজ লোড
        window.addEventListener('load', updateSVG);
    </script>
</body>
</html>
